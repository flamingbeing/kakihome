# Deploys a changed kakihome/firestore.rules to its Firebase project on merge to main (AGENTS.md, "Rules that bite").
# The rules are compiled first, so a syntax error fails the run and leaves the live rules as they were.
# Signs in without a key (Workload Identity Federation) as the rules-deployer service account (Firebase Rules Admin).
# The steps live in the app-devkit kit (deploy-rules.yml). Needs repo variables FIREBASE_PROJECT, WIF_PROVIDER and
# RULES_DEPLOYER (kakihome/SETUP.md step 9); until all three are set, the run skips cleanly. A manual run (Run workflow) deploys the rules over the live ones: ask the owner.
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - 'kakihome/firestore.rules'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: flamingbeing/app-devkit/.github/workflows/deploy-rules.yml@v1
    with:
      working-directory: kakihome   # its firebase.json names firestore.rules
      firebase-project: ${{ vars.FIREBASE_PROJECT }}
      wif-provider: ${{ vars.WIF_PROVIDER }}
      rules-deployer: ${{ vars.RULES_DEPLOYER }}
