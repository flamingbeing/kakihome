# Kaki Home checks (kakihome/NOTES.md, "How to test"): unit tests, the phone browser test (Playwright + axe) and family
# sharing against the local Firebase emulators (demo-kakihome project, fake accounts), on PRs touching Kaki Home or
# Firebase's sign-in pages. The design kit loads from its live address (design.flamingbeing.com/v1/). Two jobs run side by side; browsers and emulator jars are cached.
name: Kaki Home checks
on:
  pull_request:
    paths:
      - 'kakihome/**'
      - '__/**'
      - '.github/workflows/kakihome-checks.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    # pinned: Playwright 1.56.1 can't install Chromium on Ubuntu 26.04 (what ubuntu-latest became on 22 Oct 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node kakihome/test/logic.test.mjs
      - run: node kakihome/test/config.test.mjs
      - run: node kakihome/test/quick.test.mjs
      - run: node kakihome/test/tour.test.mjs
      - run: node kakihome/test/photo.test.mjs
      - run: node kakihome/test/merge.test.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.56.1 axe-core
          npx playwright install --with-deps chromium
      - name: Browser test
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
          SHOTS: ${{ runner.temp }}/kakihome-shots
        run: node kakihome/test/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kakihome-screenshots
          path: ${{ runner.temp }}/kakihome-shots
          if-no-files-found: ignore
  sync:
    # pinned: Playwright 1.56.1 can't install Chromium on Ubuntu 26.04 (what ubuntu-latest became on 22 Oct 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.56.1 axe-core
          npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-13.29.1
      - name: Family sharing (local emulators)
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: kakihome/test/run-sync.sh
