# Kaki Home checks (kakihome/NOTES.md, "How to test"): unit tests, and the browser specs (Playwright Test + axe; household
# sharing runs against the local Firebase emulators, demo-kakihome project, fake accounts) on PRs touching Kaki Home or
# Firebase's sign-in pages. The design kit loads from its live address (design.flamingbeing.com/v1/). Two jobs run side by
# side; browsers and emulator jars are cached.
name: Kaki Home checks
on:
  pull_request:
    paths:
      - 'kakihome/**'
      - '__/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kakihome-checks.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1.13.7
        with:
          install: 'false'
      - run: node kakihome/test/logic.test.mjs
      - run: node kakihome/test/config.test.mjs
      - run: node kakihome/test/quick.test.mjs
      - run: node kakihome/test/tour.test.mjs
      - run: node kakihome/test/photo.test.mjs
      - run: node kakihome/test/merge.test.mjs
  specs:
    # Playwright Test (playwright.config.mjs): fully parallel, 4 workers, each test with its own server, accounts and
    # household ids; the emulators start from the config.
    # pinned: Playwright 1.56.1 can't install Chromium on Ubuntu 26.04 (what ubuntu-latest became on 22 Oct 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1.13.7
      - uses: flamingbeing/app-devkit/setup-browser@v1.13.7
        with:
          devkit-dir: ''
      - uses: flamingbeing/app-devkit/setup-emulators@v1.13.7
        with:
          emulators: firestore,auth
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kakihome-specs-results
          path: test-results
          if-no-files-found: ignore
